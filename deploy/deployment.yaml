apiVersion: apps/v1
kind: Deployment
metadata:
  name: education-platform
  namespace: education
spec:
  replicas: 1
  selector:
    matchLabels:
      app: education-platform
  template:
    metadata:
      labels:
        app: education-platform
    spec:
      containers:
        - name: app
          image: ghcr.io/lujuejackie1202/education-platform:bd5009204a2e1a04bceadb124e9ef5950ffb28e3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3780
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3780"
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /login
              port: 3780
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: 3780
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: education-data
